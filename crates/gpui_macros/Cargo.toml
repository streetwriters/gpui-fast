[package]
name = "gpui_macros"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Macros used by gpui"

[lints]
workspace = true

[features]
inspector = []
# GPUI Kit paths in emitted code, for the compat/gpui-pre-macros shim; see src/facade_paths.rs
gpui-pre-facade = ["dep:proc-macro-crate"]

[lib]
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro-crate = { version = "3", optional = true }
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }

[dev-dependencies]
gpui = { workspace = true, features = ["inspector"] }
